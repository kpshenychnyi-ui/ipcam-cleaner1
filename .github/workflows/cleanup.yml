name: IPCAM cleanup

on:
  schedule:
  - cron: "0 3 1 * *"   # 1-го числа каждого месяца в 03:00 UTC (06:00 по Киеву)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый прогон (ничего не удалять)"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cleaner
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          QUOTA_GB: ${{ vars.QUOTA_GB }}
          MAX_AGE_DAYS: ${{ vars.MAX_AGE_DAYS || '300' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python cleaner.py
